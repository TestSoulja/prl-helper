<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Опора</title>
    <meta name="description" content="Личный помощник на трудные минуты." />
    <meta name="site-version" content="0.3.0" />

    <meta name="theme-color" content="#0f1418" />
    <meta name="color-scheme" content="dark" />

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Опора" />

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div id="app">
      <main id="view" class="view"></main>

      <nav id="tabbar" class="tabbar" aria-label="Разделы">
        <button class="tab is-active" data-tab="home">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 10.6 12 3l9 7.6" />
            <path d="M5.6 9.4V21h12.8V9.4" />
          </svg>
          <span>сейчас</span>
        </button>

        <button class="tab" data-tab="breath">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="8.2" />
            <circle cx="12" cy="12" r="3" />
          </svg>
          <span>дыхание</span>
        </button>

        <button class="tab" data-tab="card">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="3" />
            <path d="M7 10h6M7 14h4" />
          </svg>
          <span>карточка</span>
        </button>

        <button class="tab" data-tab="diary">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v18H6.5A1.5 1.5 0 0 1 5 19.5z" />
            <path d="M9 8h6M9 12h4" />
          </svg>
          <span>дневник</span>
        </button>
      </nav>
    </div>

    <noscript>
      <p style="padding: 24px">Для работы приложения нужен JavaScript.</p>
    </noscript>

    <script type="module" src="app.js"></script>
  </body>
</html>
